server:
  port: 8099
spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  application:
    name: FlowerKissTao
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/plant?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6386}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_COMMAND_TIMEOUT:1s}
mybatis-plus:
  # 实体扫描包，用于日志与类型别名
  type-aliases-package: com.zyt.flowerkisstao.**.domain.entity
  # 各模块自带 XML 时放在 resources/mapper/<模块名>/ 下
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      # 主键用数据库自增，与 schema.sql 的 AUTO_INCREMENT 对应
      id-type: auto
app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  redis:
    enabled: ${REDIS_ENABLED:true}
    cache-enabled: ${REDIS_CACHE_ENABLED:true}
    key-prefix: ${REDIS_KEY_PREFIX:flowerkisstao:v1}
    ttl-jitter-seconds: ${REDIS_TTL_JITTER_SECONDS:15}
    rate-limit-enabled: ${REDIS_RATE_LIMIT_ENABLED:true}
    login-limit: ${REDIS_LOGIN_LIMIT:10}
    register-limit: ${REDIS_REGISTER_LIMIT:5}
    search-limit: ${REDIS_SEARCH_LIMIT:60}
    recommendation-limit: ${REDIS_RECOMMENDATION_LIMIT:10}
    payment-limit: ${REDIS_PAYMENT_LIMIT:10}
  jwt:
    # 生产环境必须通过环境变量注入，默认值仅供本地开发
    secret: ${JWT_SECRET:flowerkisstao-local-dev-secret-key-please-change-in-production}
    # 访问令牌有效期，单位分钟
    expire-minutes: ${JWT_EXPIRE_MINUTES:120}
    # 请求头名称与 token 前缀
    header: Authorization
    prefix: "Bearer "
